    <header class="header">

            <span class="logo-title">DDrace</span>

        <nav class="nav-menu">

    <main class="page-content">
        <h1>Контактна інформація</h1>
        <p>Зв'яжіться з нами за номером телефону у футері або заповніть форму нижче, щоб надіслати свої контакти та повідомлення:</p>
        
        <div class="game-image-container">
            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRS7MCZdDy2ESl3SGYu4ybYMhFvuMvKdx33slS5Id8FtfQoo8c8d97TrZg&s=10" alt="DDraceNetwork гра" class="game-img">
        </div>

        <form class="contact-form" onsubmit="event.preventDefault(); alert('Дякуємо! Ваші дані надіслано.');">
            <div class="form-group">
                <input type="text" placeholder="Ваше ім'я" required class="form-input">
            </div>
            <div class="form-group">
                <input type="email" placeholder="Ваша електронна пошта" required class="form-input">
            </div>
            <div class="form-group">
                <textarea placeholder="Ваше повідомлення..." rows="4" required class="form-input"></textarea>
            </div>
            <button type="submit" class="submit-btn">Надіслати контакти</button>
        </form>
    </main>
